openapi: 3.1.0

info:
  title: Household API
  description: >
    Manages household-related data and profiles.
    Follows Google AIP resource-oriented design.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Household Profiles
    description: Household-related profiles and data
  - name: Accounts
    description: Bank accounts, credit cards, loans and investments
  - name: Transactions
    description: Account transactions
  - name: StatementUploads
    description: CSV statement uploads
  - name: Physical Assets
    description: Vehicle and other physical asset registry with compliance tracking
  - name: Goal Plans
    description: >
      ADR-022 Phase 1 — richer financial goal model, proxied from the wealth
      service. Admin-scoped (not profile_id-scoped) authoring of goal
      objectives/milestones/rules/trigger-events. Pure JsonNode passthrough,
      same convention as Physical Assets — no new gateway-side Java shape.
  - name: Calendar Events
    description: Household calendar events proxied from the household service
  - name: Inventory Items
    description: Grocery and supply-chain inventory proxied from the household service
  - name: Goals
    description: Financial savings goals proxied from the household service
  - name: Projections
    description: CQRS projection refresh and dashboard snapshot reads
  - name: Vacation Planner
    description: >
      Gateway-native cross-domain compute (v0.5 Phase 2) — trip budget check
      against liquid savings and vehicle compliance check against trip dates.
      Not a proxy for a single domain resource.
  - name: Console
    description: >
      Admin-only Application Console (Phase 4, ADR-023) — live service status,
      start/stop controls, and an aggregated error feed across all four
      domains. Gated behind suchika.console.enabled (default false); every
      endpoint below 404s while the flag is off.

paths:

  # ============================================================
  # ACCOUNTS
  # ============================================================

  /v1/accounts:

    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all accounts
      description: >
        Returns accounts optionally filtered by account_type, is_active, and profile_id.
        Follows AIP-132.
      parameters:
        - name: account_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: >
        Creates a new financial account scoped to a profile.
        Follows AIP-133.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}:

    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update an account
      description: >
        Partially updates an account. Only provided fields are updated.
        account_type and institution_name are immutable after creation.
        Follows AIP-134.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Accounts]
      operationId: deactivateAccount
      summary: Deactivate an account
      description: >
        Soft-deletes an account (is_active = false).
        Accounts with transactions cannot be deactivated.
        Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '204':
          description: Account deactivated
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared.yaml#/components/responses/Conflict'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/balance:

    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get the computed current balance for an account
      description: >
        opening_balance + SUM(CREDIT) - SUM(DEBIT) over the account's full
        transaction ledger (Epic 8 Phase 1, Bug 2 fix).
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/amortization:

    get:
      tags: [Accounts]
      operationId: getAmortization
      summary: Get current amortization summary for a loan account
      description: >
        Epic 8 Phase 3. Requires loan metadata set via PATCH /classification.
        Only valid for HOME_LOAN, CAR_LOAN, PERSONAL_LOAN accounts.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSummaryResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/classification:

    patch:
      tags: [Accounts]
      operationId: updateAccountClassification
      summary: Set Epic 8 classification metadata on an account
      description: >
        Merges category, liquidity_tier, purpose_tag, and joint_owners (ADR-016
        Decision 2) into the account's existing metadata map. All fields optional.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountClassificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # TRANSACTIONS
  # ============================================================

  /v1/accounts/{accountId}/transactions:

    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an account
      description: >
        Returns transactions for the given account, optionally filtered by date range
        and transaction type. Follows AIP-132.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
        - name: from
          in: query
          required: false
          description: Start date filter (inclusive), format YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date filter (inclusive), format YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: txn_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: page
          in: query
          required: false
          description: 0-indexed page number. Defaults to 0.
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size. Defaults to 50, max 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Manually enter a single transaction
      description: >
        Creates a manually-entered transaction without a CSV upload (Q7).
        Tagged with metadata.source = "MANUAL". No dedup check.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/transactions/{txnId}:

    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TxnId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/transactions/{txnId}/category:

    patch:
      tags: [Transactions]
      operationId: updateTransactionCategory
      summary: Set the expense category on a single transaction
      description: >
        Epic 8 Phase 2 manual categorization (Use Case 8.3, Q24).
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TxnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionCategoryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/transactions/category:

    patch:
      tags: [Transactions]
      operationId: bulkUpdateTransactionCategory
      summary: Set the expense category on a caller-selected list of transactions
      description: >
        Epic 8 Phase 2 bulk-tag-by-selection (Use Case 8.3, Q24 resolution — not a
        rules engine). Tags every transaction_id in the request with the same category.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateTransactionCategoryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # STATEMENT UPLOADS
  # ============================================================

  /v1/accounts/{accountId}/uploads:

    post:
      tags: [StatementUploads]
      operationId: uploadStatement
      summary: Upload a CSV bank statement
      description: >
        Parses and imports a CSV bank statement for the given account.
        Returns a statement upload record with status.
        Follows AIP-133.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStatementRequest'
      responses:
        '201':
          description: Statement uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    get:
      tags: [StatementUploads]
      operationId: listUploads
      summary: List uploads for an account
      description: Follows AIP-132.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUploadsResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/uploads/{uploadId}/errors:

    get:
      tags: [StatementUploads]
      operationId: getUploadErrors
      summary: Get structured parse errors for a failed upload
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Error entries for the upload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadErrorLogResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{accountId}/uploads/{uploadId}:

    delete:
      tags: [StatementUploads]
      operationId: rollbackUpload
      summary: Rollback a statement upload
      description: >
        Deletes all transactions imported by this upload and removes the upload record.
        Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: Upload rolled back
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # PHYSICAL ASSETS
  # ============================================================

  /v1/physical-assets:

    get:
      tags: [Physical Assets]
      operationId: listPhysicalAssets
      summary: List all physical assets
      description: >
        Returns physical assets (vehicles, etc.) optionally filtered by
        asset_type, is_active, and profile_id. Follows AIP-132.
      parameters:
        - name: asset_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPhysicalAssetsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Physical Assets]
      operationId: createPhysicalAsset
      summary: Register a physical asset
      description: >
        Creates a new physical asset scoped to a profile.
        registration_number must be unique. Follows AIP-133.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhysicalAssetRequest'
      responses:
        '201':
          description: Physical asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './shared.yaml#/components/responses/Conflict'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/physical-assets/{assetId}:

    get:
      tags: [Physical Assets]
      operationId: getPhysicalAsset
      summary: Get a physical asset
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Physical Assets]
      operationId: updatePhysicalAsset
      summary: Update a physical asset
      description: >
        Partially updates a physical asset. Only provided fields are updated.
        metadata is merged into the existing map, never replaced wholesale.
        asset_type and registration_number are immutable after creation.
        Follows AIP-134.
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhysicalAssetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Physical Assets]
      operationId: deactivatePhysicalAsset
      summary: Deactivate a physical asset
      description: Soft-deletes a physical asset (is_active = false). Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      responses:
        '204':
          description: Physical asset deactivated
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # GOAL PLANS (ADR-022 Phase 1) — pure JsonNode passthrough proxy
  # ============================================================

  /v1/goal-plans:

    get:
      tags: [Goal Plans]
      operationId: listGoalPlans
      summary: List goal plans for one admin's household
      parameters:
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGoalPlansResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Goal Plans]
      operationId: createGoalPlan
      summary: Create a goal plan
      parameters:
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalPlanRequest'
      responses:
        '201':
          description: Goal plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPlanResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './shared.yaml#/components/responses/Conflict'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/goal-plans/{goalPlanId}:

    get:
      tags: [Goal Plans]
      operationId: getGoalPlan
      summary: Get a goal plan
      parameters:
        - $ref: '#/components/parameters/GoalPlanId'
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPlanResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Goal Plans]
      operationId: updateGoalPlan
      summary: Update a goal plan
      parameters:
        - $ref: '#/components/parameters/GoalPlanId'
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalPlanRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPlanResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Goal Plans]
      operationId: deactivateGoalPlan
      summary: Deactivate a goal plan
      parameters:
        - $ref: '#/components/parameters/GoalPlanId'
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Goal plan deactivated
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/goal-plans/{goalPlanId}/milestones:

    put:
      tags: [Goal Plans]
      operationId: replaceGoalPlanMilestones
      summary: Bulk-replace a goal plan's milestones
      parameters:
        - $ref: '#/components/parameters/GoalPlanId'
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GoalMilestoneResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalMilestoneResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/goal-plans/{goalPlanId}/milestones/{milestoneId}:

    patch:
      tags: [Goal Plans]
      operationId: updateGoalPlanMilestoneAchieved
      summary: Toggle a manual-checklist milestone's achieved status
      description: >
        Only meaningful when is_manual_checklist is true on the target
        milestone — 400 otherwise.
      parameters:
        - $ref: '#/components/parameters/GoalPlanId'
        - $ref: '#/components/parameters/MilestoneId'
        - name: admin_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_achieved]
              properties:
                is_achieved:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
