  # ============================================================
  # PROJECTIONS
  # ============================================================

  /v1/projections/refresh/{profileId}:

    post:
      tags: [Projections]
      operationId: refreshProjections
      summary: Trigger full projection refresh for a profile
      description: >
        Calls each domain service, computes cross-domain metrics, and writes
        results to projections.dashboard_snapshot via UPSERT. Synchronous —
        returns 200 once all snapshots are written.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Projections refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/projections/dashboard/{profileId}:

    get:
      tags: [Projections]
      operationId: getDashboard
      summary: Read pre-computed dashboard snapshots for a profile
      description: >
        Reads from projections.dashboard_snapshot — instant response with no
        re-computation. Returns an empty snapshots list if no refresh has run.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard snapshots returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/vacation-planner/budget-check:

    post:
      tags: [Vacation Planner]
      operationId: vacationPlannerBudgetCheck
      summary: Check trip budget against liquid savings and vehicle compliance against trip dates
      description: >
        Reads the profile's already-computed WEALTH_LIQUIDITY_TIERS_FAMILY
        snapshot (refresh the dashboard first if it does not exist yet) and
        compares the LIQUID tier balance to the trip cost. Separately checks
        every active VEHICLE physical asset's PUC/insurance expiry (read
        directly from JSONB metadata) against the trip end date.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdRequiredQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacationPlannerRequest'
      responses:
        '200':
          description: Budget and compliance check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationPlannerResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

