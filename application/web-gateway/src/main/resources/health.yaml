openapi: 3.1.0

info:
  title: Health API
  description: >
    Manages vital sign readings and doctor visit records for household members.
    Resources are nested under profiles — every reading belongs to exactly one
    household member.

    BLOOD_PRESSURE readings require both value_primary (systolic) and
    value_secondary (diastolic) to be provided. All other vital types use
    value_primary only; value_secondary must be omitted or null.

    Follows Google AIP resource-oriented design with pagination (AIP-158).
    Vital readings are paginated because they accumulate continuously over years.
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local development

tags:
  - name: Vitals
    description: Biometric vital sign readings (weight, BP, blood sugar, etc.)
  - name: Doctor Visits
    description: Doctor appointment and visit records

paths:

  # ============================================================
  # VITAL READINGS — nested under profile
  # ============================================================

  /v1/profiles/{profile_id}/vitals:

    get:
      tags: [Vitals]
      operationId: listVitals
      summary: List vital readings for a profile
      description: >
        Returns paginated vital readings for a household member, newest first.
        Filter by vital_type to narrow to one metric.
        Follows AIP-132 + AIP-158.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: './shared.yaml#/components/parameters/PageSize'
        - $ref: './shared.yaml#/components/parameters/PageToken'
        - name: vital_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VitalType'
        - name: from_date
          in: query
          required: false
          description: Inclusive start date filter.
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          description: Inclusive end date filter.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVitalsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Vitals]
      operationId: createVital
      summary: Record a vital reading
      description: >
        Records a new biometric reading. For BLOOD_PRESSURE,
        both value_primary (systolic) and value_secondary (diastolic)
        are required. For all other types, provide value_primary only.
        Follows AIP-133.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVitalRequest'
      responses:
        '201':
          description: Vital reading recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/profiles/{profile_id}/vitals/{vital_id}:

    get:
      tags: [Vitals]
      operationId: getVital
      summary: Get a vital reading
      description: Follows AIP-131.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/VitalId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Vitals]
      operationId: deleteVital
      summary: Delete a vital reading
      description: >
        Hard-deletes a vital reading. Used to correct accidental entries.
        Follows AIP-135.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/VitalId'
      responses:
        '204':
          description: Vital reading deleted
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # DOCTOR VISITS — nested under profile
  # ============================================================

  /v1/profiles/{profile_id}/doctor-visits:

    get:
      tags: [Doctor Visits]
      operationId: listDoctorVisits
      summary: List doctor visits for a profile
      description: >
        Returns all doctor visits for a household member, newest first.
        Not paginated — visit count per member is always manageable.
        Follows AIP-132.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - name: from_date
          in: query
          required: false
          description: Inclusive start date filter.
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          description: Inclusive end date filter.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDoctorVisitsResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Doctor Visits]
      operationId: createDoctorVisit
      summary: Record a doctor visit
      description: Follows AIP-133.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDoctorVisitRequest'
      responses:
        '201':
          description: Doctor visit recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorVisitResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/profiles/{profile_id}/doctor-visits/{visit_id}:

    get:
      tags: [Doctor Visits]
      operationId: getDoctorVisit
      summary: Get a doctor visit
      description: Follows AIP-131.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/VisitId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorVisitResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Doctor Visits]
      operationId: updateDoctorVisit
      summary: Update a doctor visit
      description: >
        Partially updates a doctor visit record. Typically used to add
        notes, prescription details, or follow-up date after the visit.
        Follows AIP-134.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDoctorVisitRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorVisitResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Doctor Visits]
      operationId: deleteDoctorVisit
      summary: Delete a doctor visit
      description: >
        Hard-deletes a doctor visit record. Used to correct accidental entries.
        Follows AIP-135.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - $ref: '#/components/parameters/VisitId'
      responses:
        '204':
          description: Doctor visit deleted
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

components:

  parameters:

    VitalId:
      name: vital_id
      in: path
      required: true
      description: Unique identifier of the vital reading.
      schema:
        type: string
        format: uuid

    VisitId:
      name: visit_id
      in: path
      required: true
      description: Unique identifier of the doctor visit.
      schema:
        type: string
        format: uuid

  schemas:

    # ----------------------------------------------------------
    # ENUMS
    # ----------------------------------------------------------

    VitalType:
      type: string
      description: >
        The biometric metric being recorded.
        BLOOD_PRESSURE is the only type that requires value_secondary (diastolic).
        BMI is typically calculated from WEIGHT + HEIGHT readings, but can also
        be recorded directly from a smart scale.
      enum:
        - WEIGHT
        - HEIGHT
        - BLOOD_PRESSURE
        - BLOOD_SUGAR_FASTING
        - BLOOD_SUGAR_PP
        - HEART_RATE
        - TEMPERATURE
        - OXYGEN_SATURATION
        - BMI
        - WAIST_CIRCUMFERENCE

    # ----------------------------------------------------------
    # VITAL READING DTOs
    # ----------------------------------------------------------

    VitalResponse:
      type: object
      description: A single biometric vital sign reading for a household member.
      required:
        - name
        - vital_id
        - profile_id
        - vital_type
        - value_primary
        - unit
        - recorded_at
        - created_at
      properties:
        name:
          type: string
          description: "Resource name. Format: profiles/{profile_id}/vitals/{vital_id}"
          readOnly: true
        vital_id:
          type: string
          format: uuid
          readOnly: true
        profile_id:
          type: string
          format: uuid
          readOnly: true
        vital_type:
          $ref: '#/components/schemas/VitalType'
        value_primary:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: 0
          description: >
            Primary measurement value. For BLOOD_PRESSURE this is the systolic reading.
            For all other types, this is the sole measurement.
          example: 120.0
        value_secondary:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: 0
          description: >
            Secondary measurement value. Required for BLOOD_PRESSURE (diastolic reading).
            Null for all other vital types.
          example: 80.0
        unit:
          type: string
          minLength: 1
          maxLength: 20
          description: >
            Measurement unit string. Examples: kg, cm, mmHg, mg/dL, bpm, °C, %, kg/m².
            Not an enum — units evolve and are validated in the Java service layer.
          example: "mmHg"
        notes:
          type: string
          nullable: true
          maxLength: 500
          description: Optional contextual notes (e.g., "measured after 8h fast", "post-exercise").
        recorded_at:
          type: string
          format: date-time
          description: When the measurement was taken (may differ from created_at for manual entry).
          example: "2026-06-13T07:30:00+05:30"
        created_at:
          type: string
          format: date-time
          description: When the record was entered into the system.
          readOnly: true

    CreateVitalRequest:
      type: object
      required:
        - vital_type
        - value_primary
        - unit
        - recorded_at
      properties:
        vital_type:
          $ref: '#/components/schemas/VitalType'
        value_primary:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: 0
          example: 120.0
        value_secondary:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: 0
          description: >
            Required when vital_type = BLOOD_PRESSURE (diastolic value).
            Must be omitted or null for all other vital types.
          example: 80.0
        unit:
          type: string
          minLength: 1
          maxLength: 20
          example: "mmHg"
        notes:
          type: string
          nullable: true
          maxLength: 500
        recorded_at:
          type: string
          format: date-time
          description: >
            When the measurement was actually taken. Use current time for live readings.
            May be a past timestamp for manually entered historical data.
          example: "2026-06-13T07:30:00+05:30"

    ListVitalsResponse:
      type: object
      required:
        - vitals
        - total_size
      properties:
        vitals:
          type: array
          items:
            $ref: '#/components/schemas/VitalResponse'
        total_size:
          type: integer
          minimum: 0
          description: Total matching readings (ignoring pagination).
        next_page_token:
          type: string
          nullable: true
          description: Opaque token for the next page. Null when on last page.

    # ----------------------------------------------------------
    # DOCTOR VISIT DTOs
    # ----------------------------------------------------------

    DoctorVisitResponse:
      type: object
      description: A doctor visit or medical appointment record.
      required:
        - name
        - visit_id
        - profile_id
        - from_date
        - created_at
      properties:
        name:
          type: string
          description: "Resource name. Format: profiles/{profile_id}/doctor-visits/{visit_id}"
          readOnly: true
        visit_id:
          type: string
          format: uuid
          readOnly: true
        profile_id:
          type: string
          format: uuid
          readOnly: true
        from_date:
          type: string
          format: date
          description: Date the appointment started (or single-day visit date).
          example: "2026-06-10"
        to_date:
          type: string
          format: date
          nullable: true
          description: >
            End date for multi-day hospitalizations. Null for outpatient/single-day visits.
            Must be >= from_date when provided.
          example: "2026-06-12"
        doctor_name:
          type: string
          nullable: true
          maxLength: 200
          example: "Dr. Priya Sharma"
        speciality:
          type: string
          nullable: true
          maxLength: 100
          description: Medical speciality (e.g., "Cardiologist", "General Physician").
          example: "Cardiologist"
        hospital_name:
          type: string
          nullable: true
          maxLength: 200
          example: "Ruby Hall Clinic"
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Reason for visit or diagnosis summary.
          example: "Annual cardiac checkup"
        prescription_notes:
          type: string
          nullable: true
          maxLength: 2000
          description: Prescription or treatment plan notes.
        follow_up_date:
          type: string
          format: date
          nullable: true
          description: Date of the next scheduled follow-up appointment.
          example: "2026-09-10"
        created_at:
          type: string
          format: date-time
          readOnly: true

    CreateDoctorVisitRequest:
      type: object
      required:
        - from_date
      properties:
        from_date:
          type: string
          format: date
          example: "2026-06-10"
        to_date:
          type: string
          format: date
          nullable: true
          description: Must be >= from_date when provided.
          example: "2026-06-12"
        doctor_name:
          type: string
          nullable: true
          maxLength: 200
          example: "Dr. Priya Sharma"
        speciality:
          type: string
          nullable: true
          maxLength: 100
          example: "Cardiologist"
        hospital_name:
          type: string
          nullable: true
          maxLength: 200
          example: "Ruby Hall Clinic"
        reason:
          type: string
          nullable: true
          maxLength: 500
          example: "Annual cardiac checkup"
        prescription_notes:
          type: string
          nullable: true
          maxLength: 2000
        follow_up_date:
          type: string
          format: date
          nullable: true
          example: "2026-09-10"

    UpdateDoctorVisitRequest:
      type: object
      description: >
        All fields optional. Typically used to add prescription notes,
        speciality, or follow-up date after an initial quick entry.
      properties:
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
          nullable: true
        doctor_name:
          type: string
          nullable: true
          maxLength: 200
        speciality:
          type: string
          nullable: true
          maxLength: 100
        hospital_name:
          type: string
          nullable: true
          maxLength: 200
        reason:
          type: string
          nullable: true
          maxLength: 500
        prescription_notes:
          type: string
          nullable: true
          maxLength: 2000
        follow_up_date:
          type: string
          format: date
          nullable: true

    ListDoctorVisitsResponse:
      type: object
      required:
        - visits
        - total_size
      properties:
        visits:
          type: array
          items:
            $ref: '#/components/schemas/DoctorVisitResponse'
        total_size:
          type: integer
          minimum: 0
