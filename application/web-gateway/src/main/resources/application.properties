# HTTP — the BFF is the only service the React frontend talks to
quarkus.http.port=8080

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Downstream domain service URLs (MicroProfile Rest Client base URLs)
# Each domain service runs on its own port — no conflicts when all run simultaneously.
# Override with env vars in staging/prod.
suchika.services.profile.url=${PROFILE_SERVICE_URL:http://localhost:8081}
suchika.services.wealth.url=${WEALTH_SERVICE_URL:http://localhost:8082}
suchika.services.health.url=${HEALTH_SERVICE_URL:http://localhost:8083}
suchika.services.household.url=${HOUSEHOLD_SERVICE_URL:http://localhost:8084}
