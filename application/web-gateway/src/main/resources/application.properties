# HTTP — the BFF is the only service the React frontend talks to
quarkus.http.port=8080

# Database — used exclusively for projections.dashboard_snapshot (CQRS read model)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:app_user}
quarkus.datasource.password=${DB_PASSWORD:local_dev_only}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}

# Hibernate ORM — validate schema on startup (migrations already run by projections Flyway)
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=Asia/Kolkata

# Flyway — manage projections schema migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/projections
quarkus.flyway.schemas=projections

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# CORS — allow the React dev server to call the gateway
# NOTE: the toggle is "quarkus.http.cors.enabled", not the bare "quarkus.http.cors"
# (confirmed against quarkus-vertx-http's own config model — the bare key was never
# a real property in this Quarkus version, hence the prior "Unrecognized configuration
# key" warning and silently-inactive CORS filter).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# Downstream domain service URLs (MicroProfile Rest Client base URLs)
# Each domain service runs on its own port — no conflicts when all run simultaneously.
# Override with env vars in staging/prod.
quarkus.rest-client.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.wealth-service.url=${WEALTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.health-service.url=${HEALTH_SERVICE_URL:http://localhost:8083}
quarkus.rest-client.household-service.url=${HOUSEHOLD_SERVICE_URL:http://localhost:8084}

# Test configuration — bind to a random free port to prevent conflicts with running services
%test.quarkus.http.test-port=0
# Disable DB connectivity in tests — all DB-backed beans are @InjectMock'd
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.migrate-at-start=false

# Epic 8 Phase 3 — per-account-type annual growth rates for WEALTH_GROWTH_PROJECTION_FAMILY
app.wealth.growth.rate.MUTUAL_FUND=0.12
app.wealth.growth.rate.NPS=0.10
app.wealth.growth.rate.PPF=0.071

# Runtime log file — read by lnav. Dev mode only.
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=${user.home}/.suchika/logs/gateway.log
%dev.quarkus.log.file.level=DEBUG
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss\,SSS} %-5p [gateway] [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=2

