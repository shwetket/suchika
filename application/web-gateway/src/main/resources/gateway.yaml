openapi: 3.1.0

info:
  title: Household API
  description: >
    Manages household-related data and profiles.
    Follows Google AIP resource-oriented design.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Household Profiles
    description: Household-related profiles and data
  - name: Accounts
    description: Bank accounts, credit cards, loans and investments
  - name: Transactions
    description: Account transactions
  - name: StatementUploads
    description: CSV statement uploads

paths:

  # ============================================================
  # ACCOUNTS
  # ============================================================

  /v1/accounts:

    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all accounts
      description: >
        Returns accounts optionally filtered by account_type, is_active, and profile_id.
        Follows AIP-132.
      parameters:
        - name: account_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: >
        Creates a new financial account scoped to a profile.
        Follows AIP-133.
      parameters:
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{accountId}:

    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update an account
      description: >
        Partially updates an account. Only provided fields are updated.
        account_type and institution_name are immutable after creation.
        Follows AIP-134.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Accounts]
      operationId: deactivateAccount
      summary: Deactivate an account
      description: >
        Soft-deletes an account (is_active = false).
        Accounts with transactions cannot be deactivated.
        Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account deactivated
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================
  # TRANSACTIONS
  # ============================================================

  /v1/accounts/{accountId}/transactions:

    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an account
      description: >
        Returns transactions for the given account, optionally filtered by date range
        and transaction type. Follows AIP-132.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          required: false
          description: Start date filter (inclusive), format YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date filter (inclusive), format YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: txn_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{accountId}/transactions/{txnId}:

    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TxnId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================
  # STATEMENT UPLOADS
  # ============================================================

  /v1/accounts/{accountId}/uploads:

    post:
      tags: [StatementUploads]
      operationId: uploadStatement
      summary: Upload a CSV bank statement
      description: >
        Parses and imports a CSV bank statement for the given account.
        Returns a statement upload record with status.
        Follows AIP-133.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStatementRequest'
      responses:
        '201':
          description: Statement uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [StatementUploads]
      operationId: listUploads
      summary: List uploads for an account
      description: Follows AIP-132.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUploadsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{accountId}/uploads/{uploadId}:

    delete:
      tags: [StatementUploads]
      operationId: rollbackUpload
      summary: Rollback a statement upload
      description: >
        Deletes all transactions imported by this upload and removes the upload record.
        Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: Upload rolled back
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  parameters:

    AccountId:
      name: accountId
      in: path
      required: true
      description: Unique identifier of the account
      schema:
        type: string
        format: uuid

    TxnId:
      name: txnId
      in: path
      required: true
      description: Unique identifier of the transaction
      schema:
        type: string
        format: uuid

    UploadId:
      name: uploadId
      in: path
      required: true
      description: Unique identifier of the statement upload
      schema:
        type: string
        format: uuid

  schemas:

    # ----------------------------------------------------------
    # ENUMS
    # ----------------------------------------------------------

    AccountType:
      type: string
      enum:
        - SAVINGS
        - CURRENT
        - CREDIT_CARD
        - HOME_LOAN
        - PERSONAL_LOAN
        - CAR_LOAN
        - MUTUAL_FUND
        - NPS
        - PPF
        - FD

    TransactionType:
      type: string
      enum:
        - CREDIT
        - DEBIT

    UploadStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED

    # ----------------------------------------------------------
    # ACCOUNT DTOs
    # ----------------------------------------------------------

    AccountResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
          readOnly: true
        account_name:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountType'
        institution_name:
          type: string
        opening_balance:
          type: number
          format: double
        credit_limit:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        emi_amount:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    CreateAccountRequest:
      type: object
      required:
        - account_name
        - account_type
        - institution_name
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 100
        account_type:
          $ref: '#/components/schemas/AccountType'
        institution_name:
          type: string
          minLength: 1
          maxLength: 100
        opening_balance:
          type: number
          format: double
          default: 0.00
        credit_limit:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        emi_amount:
          type: number
          format: double
          nullable: true

    UpdateAccountRequest:
      type: object
      description: All fields optional. Only provided fields are updated.
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 100
        opening_balance:
          type: number
          format: double
        credit_limit:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        emi_amount:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean

    ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        next_page_token:
          type: string
          nullable: true
        total_size:
          type: integer
          minimum: 0

    # ----------------------------------------------------------
    # TRANSACTION DTOs
    # ----------------------------------------------------------

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
          nullable: true
        txn_date:
          type: string
          format: date
        amount:
          type: number
          format: double
        txn_type:
          $ref: '#/components/schemas/TransactionType'
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    ListTransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'

    # ----------------------------------------------------------
    # STATEMENT UPLOAD DTOs
    # ----------------------------------------------------------

    UploadStatementRequest:
      type: object
      required:
        - file_name
        - csv_content
      properties:
        file_name:
          type: string
        csv_content:
          type: string

    StatementUploadResponse:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
        file_name:
          type: string
        upload_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/UploadStatus'

    ListUploadsResponse:
      type: object
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/StatementUploadResponse'

    # ----------------------------------------------------------
    # ERROR
    # ----------------------------------------------------------

    Error:
      type: object
      required:
        - code
        - message
        - status
      properties:
        code:
          type: integer
        status:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

  responses:

    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource already exists or has conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
