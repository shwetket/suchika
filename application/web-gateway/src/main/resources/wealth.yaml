openapi: 3.1.0

info:
  title: Wealth API
  description: >
    Manages financial accounts, transaction history, statement uploads,
    and physical assets. All monetary values are stored in INR with
    4 decimal places for precision (NUMERIC 19,4 in PostgreSQL).

    Calculated values (current_balance, loan_outstanding, current_value)
    are NOT stored here — they live in projections.dashboard_snapshot and
    are served by the web-gateway read API.

    Follows Google AIP resource-oriented design with pagination (AIP-158).
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Accounts
    description: Financial accounts (bank, loan, investment) per household member
  - name: Transactions
    description: Transaction ledger entries (read-only — written via statement upload)
  - name: Statements
    description: CSV/PDF statement upload, parsing, and error reporting
  - name: Physical Assets
    description: Real estate and vehicles owned by household members

paths:

  # ============================================================
  # ACCOUNTS
  # ============================================================

  /v1/accounts:

    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: >
        Returns accounts, optionally filtered by profile and/or type.
        Not paginated — account count per household is always tiny.
        Follows AIP-132.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - name: account_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: >
        Creates a new financial account for a household member.
        Static fields (opening_balance, credit_limit, interest_rate, emi_amount)
        are stored here. Calculated balance/outstanding values go to projections.
        Follows AIP-133.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared.yaml#/components/responses/Conflict'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{account_id}:

    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update an account
      description: >
        Partially updates an account. Only provided fields are updated.
        account_type and profile_id are immutable after creation.
        Follows AIP-134.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Accounts]
      operationId: deactivateAccount
      summary: Deactivate an account
      description: >
        Soft-deletes an account (is_active = false).
        Transactions linked to this account remain for historical reporting.
        Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account deactivated
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared.yaml#/components/responses/FailedPrecondition'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # TRANSACTIONS (read-only — written via statement upload)
  # ============================================================

  /v1/accounts/{account_id}/transactions:

    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an account
      description: >
        Returns paginated transactions for one account, newest first.
        Transactions are written by the statement upload pipeline, not directly.
        Follows AIP-132 + AIP-158.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: './shared.yaml#/components/parameters/PageSize'
        - $ref: './shared.yaml#/components/parameters/PageToken'
        - name: from_date
          in: query
          required: false
          description: Inclusive start date filter (ISO 8601).
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          description: Inclusive end date filter (ISO 8601).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # STATEMENT UPLOADS — custom method per AIP-136
  # ============================================================

  /v1/accounts/{account_id}:uploadStatement:

    post:
      tags: [Statements]
      operationId: uploadStatement
      summary: Upload a bank statement
      description: >
        Parses a CSV or PDF bank statement and bulk-inserts transactions.
        Returns a summary of success/failure with per-row error details.
        Uses custom :uploadStatement method per AIP-136.
        Statement date range must not overlap with a previously uploaded range
        for the same account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadStatementRequest'
      responses:
        '200':
          description: Upload processed (may be partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResult'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared.yaml#/components/responses/Conflict'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/accounts/{account_id}/uploads:

    get:
      tags: [Statements]
      operationId: listUploads
      summary: List statement uploads for an account
      description: >
        Returns all previous statement upload records for audit purposes.
        Follows AIP-132.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUploadsResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  # ============================================================
  # PHYSICAL ASSETS
  # ============================================================

  /v1/physical-assets:

    get:
      tags: [Physical Assets]
      operationId: listPhysicalAssets
      summary: List physical assets
      description: >
        Returns physical assets, optionally filtered by profile.
        Not paginated — physical asset count per household is always small.
        Follows AIP-132.
      parameters:
        - $ref: './shared.yaml#/components/parameters/ProfileIdParam'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPhysicalAssetsResponse'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    post:
      tags: [Physical Assets]
      operationId: createPhysicalAsset
      summary: Create a physical asset
      description: Follows AIP-133.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhysicalAssetRequest'
      responses:
        '201':
          description: Physical asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

  /v1/physical-assets/{asset_id}:

    get:
      tags: [Physical Assets]
      operationId: getPhysicalAsset
      summary: Get a physical asset
      description: Follows AIP-131.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    patch:
      tags: [Physical Assets]
      operationId: updatePhysicalAsset
      summary: Update a physical asset
      description: >
        Partially updates a physical asset. Only provided fields are updated.
        asset_type and profile_id are immutable after creation.
        Follows AIP-134.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhysicalAssetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAssetResponse'
        '400':
          $ref: './shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

    delete:
      tags: [Physical Assets]
      operationId: deactivatePhysicalAsset
      summary: Deactivate a physical asset (mark as sold/disposed)
      description: Follows AIP-135.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Physical asset deactivated
        '404':
          $ref: './shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './shared.yaml#/components/responses/InternalError'

components:

  parameters:

    AccountId:
      name: account_id
      in: path
      required: true
      description: Unique identifier of the financial account.
      schema:
        type: string
        format: uuid
        example: "b2c3d4e5-f6a7-8901-bcde-f01234567890"

    AssetId:
      name: asset_id
      in: path
      required: true
      description: Unique identifier of the physical asset.
      schema:
        type: string
        format: uuid
        example: "c3d4e5f6-a7b8-9012-cdef-012345678901"

  schemas:

    # ----------------------------------------------------------
    # ENUMS
    # ----------------------------------------------------------

    AccountType:
      type: string
      description: >
        Granular financial account type. Determines which optional static fields
        are relevant: credit_limit (CREDIT_CARD), emi_amount + interest_rate
        (loans), opening_balance (savings/current/investments).
      enum:
        - SAVINGS
        - CURRENT
        - CREDIT_CARD
        - HOME_LOAN
        - PERSONAL_LOAN
        - CAR_LOAN
        - MUTUAL_FUND
        - NPS
        - PPF
        - FD

    TransactionType:
      type: string
      description: Direction of money flow from the account holder's perspective.
      enum:
        - CREDIT
        - DEBIT

    UploadStatus:
      type: string
      description: >
        Outcome of a statement upload attempt.
        SUCCESS: all rows parsed and inserted.
        PARTIAL: some rows inserted, some failed (see errors array).
        FAILED: zero rows inserted.
      enum:
        - SUCCESS
        - PARTIAL
        - FAILED

    UploadErrorType:
      type: string
      description: Reason a specific row or the entire file could not be parsed.
      enum:
        - MISSING_DATE_COLUMN
        - MISSING_AMOUNT_COLUMN
        - MISSING_REQUIRED_COLUMN
        - PARSE_ERROR
        - VALIDATION_ERROR

    AssetType:
      type: string
      description: Category of physical asset.
      enum:
        - RESIDENTIAL_PROPERTY
        - COMMERCIAL_PROPERTY
        - LAND
        - CAR
        - TWO_WHEELER
        - COMMERCIAL_VEHICLE
        - GOLD_JEWELLERY
        - OTHER_VEHICLE
        - OTHER_PROPERTY

    RegistrationType:
      type: string
      description: Indian vehicle/property registration type.
      enum:
        - PRIVATE
        - COMMERCIAL
        - GOVERNMENT
        - BH_SERIES

    # ----------------------------------------------------------
    # ACCOUNT DTOs
    # ----------------------------------------------------------

    AccountResponse:
      type: object
      description: A financial account (bank, loan, or investment) owned by a household member.
      required:
        - name
        - account_id
        - profile_id
        - account_type
        - account_name
        - currency
        - is_active
        - created_at
      properties:
        name:
          type: string
          description: "Resource name. Format: accounts/{account_id}"
          readOnly: true
          example: "accounts/b2c3d4e5-f6a7-8901-bcde-f01234567890"
        account_id:
          type: string
          format: uuid
          readOnly: true
        profile_id:
          type: string
          format: uuid
          readOnly: true
        account_type:
          $ref: '#/components/schemas/AccountType'
        account_name:
          type: string
          description: Human-readable label (e.g., "HDFC Savings", "SBI Home Loan")
          example: "HDFC Savings"
        bank_name:
          type: string
          nullable: true
          example: "HDFC Bank"
        account_number_last4:
          type: string
          nullable: true
          description: Last 4 digits of the account number for UI display.
          pattern: '^\d{4}$'
          example: "4532"
        currency:
          $ref: './shared.yaml#/components/schemas/Currency'
        opening_balance:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            Initial balance at account creation (SAVINGS, CURRENT, FD, PPF, NPS).
            Null for loan accounts and mutual funds.
          example: 50000.00
        credit_limit:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Sanctioned credit limit (CREDIT_CARD only).
          example: 300000.00
        interest_rate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: Annual interest rate as a percentage (HOME_LOAN, PERSONAL_LOAN, CAR_LOAN, FD).
          example: 8.65
        emi_amount:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Fixed monthly EMI (HOME_LOAN, PERSONAL_LOAN, CAR_LOAN).
          example: 45000.00
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    CreateAccountRequest:
      type: object
      required:
        - profile_id
        - account_type
        - account_name
      properties:
        profile_id:
          type: string
          format: uuid
          description: Household member who owns this account.
        account_type:
          $ref: '#/components/schemas/AccountType'
        account_name:
          type: string
          minLength: 1
          maxLength: 150
          example: "HDFC Savings"
        bank_name:
          type: string
          minLength: 1
          maxLength: 150
          nullable: true
          example: "HDFC Bank"
        account_number_last4:
          type: string
          nullable: true
          pattern: '^\d{4}$'
          description: Last 4 digits only — never store full account numbers.
          example: "4532"
        opening_balance:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 50000.00
        credit_limit:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 300000.00
        interest_rate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          example: 8.65
        emi_amount:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 45000.00

    UpdateAccountRequest:
      type: object
      description: >
        Mutable fields only. account_type and profile_id are immutable after creation.
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 150
        bank_name:
          type: string
          minLength: 1
          maxLength: 150
          nullable: true
        account_number_last4:
          type: string
          nullable: true
          pattern: '^\d{4}$'
        opening_balance:
          type: number
          format: double
          nullable: true
          minimum: 0
        credit_limit:
          type: number
          format: double
          nullable: true
          minimum: 0
        interest_rate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        emi_amount:
          type: number
          format: double
          nullable: true
          minimum: 0
        is_active:
          type: boolean

    ListAccountsResponse:
      type: object
      required:
        - accounts
        - total_size
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        total_size:
          type: integer
          minimum: 0

    # ----------------------------------------------------------
    # TRANSACTION DTOs
    # ----------------------------------------------------------

    TransactionResponse:
      type: object
      description: A single ledger entry written by the statement upload pipeline.
      required:
        - name
        - transaction_id
        - account_id
        - transaction_date
        - amount
        - transaction_type
        - currency
      properties:
        name:
          type: string
          description: "Resource name. Format: accounts/{account_id}/transactions/{transaction_id}"
          readOnly: true
        transaction_id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
          readOnly: true
        transaction_date:
          type: string
          format: date
        amount:
          type: number
          format: double
          minimum: 0
          description: Absolute amount. Direction is determined by transaction_type.
          example: 1234.56
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        currency:
          $ref: './shared.yaml#/components/schemas/Currency'
        description:
          type: string
          nullable: true
          description: Merchant/payee name or narration from the statement.
          example: "SWIGGY ORDER 123"
        category:
          type: string
          nullable: true
          description: User-assigned spending category.
          example: "Food"
        reference_number:
          type: string
          nullable: true
          description: Bank-provided reference/UTR number.
        uploaded_at:
          type: string
          format: date-time
          readOnly: true

    ListTransactionsResponse:
      type: object
      required:
        - transactions
        - total_size
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        total_size:
          type: integer
          minimum: 0
          description: Total matching transactions (ignoring pagination).
        next_page_token:
          type: string
          nullable: true
          description: Opaque token for the next page. Null when on last page.

    # ----------------------------------------------------------
    # STATEMENT UPLOAD DTOs
    # ----------------------------------------------------------

    UploadStatementRequest:
      type: object
      required:
        - file
        - statement_from_date
        - statement_to_date
      properties:
        file:
          type: string
          format: binary
          description: CSV or PDF bank statement file. Max 10 MB.
        statement_from_date:
          type: string
          format: date
          description: First date covered by this statement (inclusive).
        statement_to_date:
          type: string
          format: date
          description: Last date covered by this statement (inclusive).

    UploadError:
      type: object
      description: A single row that failed to parse or validate during upload.
      required:
        - row_number
        - error_type
        - raw_line
        - message
      properties:
        row_number:
          type: integer
          minimum: 1
          description: 1-based row number in the source file.
        error_type:
          $ref: '#/components/schemas/UploadErrorType'
        raw_line:
          type: string
          description: The original unparsed line from the source file.
        message:
          type: string
          description: Human-readable explanation of why this row failed.

    StatementUploadResult:
      type: object
      description: Summary of a statement upload attempt.
      required:
        - upload_id
        - account_id
        - status
        - rows_total
        - rows_inserted
        - rows_failed
        - uploaded_at
      properties:
        upload_id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/UploadStatus'
        rows_total:
          type: integer
          minimum: 0
          description: Total rows found in the file (excluding header).
        rows_inserted:
          type: integer
          minimum: 0
        rows_failed:
          type: integer
          minimum: 0
        errors:
          type: array
          description: Per-row errors. Empty when status = SUCCESS.
          items:
            $ref: '#/components/schemas/UploadError'
        uploaded_at:
          type: string
          format: date-time
          readOnly: true

    StatementUploadSummary:
      type: object
      description: Lightweight upload record for listing purposes (no per-row error detail).
      required:
        - upload_id
        - account_id
        - status
        - rows_total
        - rows_inserted
        - rows_failed
        - uploaded_at
      properties:
        upload_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadStatus'
        rows_total:
          type: integer
          minimum: 0
        rows_inserted:
          type: integer
          minimum: 0
        rows_failed:
          type: integer
          minimum: 0
        uploaded_at:
          type: string
          format: date-time

    ListUploadsResponse:
      type: object
      required:
        - uploads
        - total_size
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/StatementUploadSummary'
        total_size:
          type: integer
          minimum: 0

    # ----------------------------------------------------------
    # PHYSICAL ASSET DTOs
    # ----------------------------------------------------------

    PhysicalAssetResponse:
      type: object
      description: A physical asset (property or vehicle) owned by a household member.
      required:
        - name
        - asset_id
        - profile_id
        - asset_type
        - asset_name
        - currency
        - purchase_value
        - purchase_date
        - is_active
        - created_at
      properties:
        name:
          type: string
          description: "Resource name. Format: physical-assets/{asset_id}"
          readOnly: true
          example: "physical-assets/c3d4e5f6-a7b8-9012-cdef-012345678901"
        asset_id:
          type: string
          format: uuid
          readOnly: true
        profile_id:
          type: string
          format: uuid
          readOnly: true
        asset_type:
          $ref: '#/components/schemas/AssetType'
        asset_name:
          type: string
          description: Human-readable label (e.g., "Pune Flat", "Honda City")
          example: "Pune Flat"
        currency:
          $ref: './shared.yaml#/components/schemas/Currency'
        purchase_value:
          type: number
          format: double
          minimum: 0
          description: Original purchase price at acquisition date.
          example: 6500000.00
        purchase_date:
          type: string
          format: date
          example: "2019-11-01"
        registration_number:
          type: string
          nullable: true
          description: Vehicle registration plate or property registration number.
          example: "MH12AB1234"
        registration_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RegistrationType'
        metadata:
          type: object
          nullable: true
          description: >
            Flexible JSONB bag for asset-specific attributes not in the fixed schema.
            Examples: {"make": "Honda", "model": "City", "year": 2019} for vehicles;
            {"locality": "Baner", "carpet_area_sqft": 950} for property.
          additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true

    CreatePhysicalAssetRequest:
      type: object
      required:
        - profile_id
        - asset_type
        - asset_name
        - purchase_value
        - purchase_date
      properties:
        profile_id:
          type: string
          format: uuid
        asset_type:
          $ref: '#/components/schemas/AssetType'
        asset_name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Pune Flat"
        purchase_value:
          type: number
          format: double
          minimum: 0
          example: 6500000.00
        purchase_date:
          type: string
          format: date
          example: "2019-11-01"
        registration_number:
          type: string
          nullable: true
          maxLength: 50
          example: "MH12AB1234"
        registration_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RegistrationType'
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    UpdatePhysicalAssetRequest:
      type: object
      description: >
        Mutable fields only. asset_type and profile_id are immutable after creation.
      properties:
        asset_name:
          type: string
          minLength: 1
          maxLength: 200
        purchase_value:
          type: number
          format: double
          minimum: 0
        purchase_date:
          type: string
          format: date
        registration_number:
          type: string
          nullable: true
          maxLength: 50
        registration_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RegistrationType'
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        is_active:
          type: boolean

    ListPhysicalAssetsResponse:
      type: object
      required:
        - assets
        - total_size
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalAssetResponse'
        total_size:
          type: integer
          minimum: 0
