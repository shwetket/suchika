openapi: 3.1.0

info:
  title: Finance API
  description: >
    Manages personal finance accounts.
    Follows Google AIP resource-oriented design.
  version: 1.0.0
  contact:
    name: Finance Service

servers:
  - url: http://localhost:8082
    description: Local development

tags:
  - name: Accounts
    description: Bank accounts, credit cards, loans and investments
  - name: Uploads
    description: CSV statement uploads and error inspection
  - name: Transactions
    description: Ledger transactions and expense categorization
  - name: PhysicalAssets
    description: Vehicle and other physical asset registry with compliance tracking

paths:

  /v1/accounts:

    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all accounts
      description: >
        Returns a paginated list of accounts.
        Supports filtering by account_type and is_active.
        Follows AIP-132 (Standard List) and AIP-158 (Pagination).
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - name: account_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully listed accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: >
        Creates a new account.
        Follows AIP-133 (Standard Create).
        The name field must be unique per institution.
      parameters:
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/uploads:

    post:
      tags: [Uploads]
      operationId: uploadStatement
      summary: Upload a CSV bank statement
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStatementRequest'
      responses:
        '201':
          description: Upload processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Uploads]
      operationId: listUploads
      summary: List uploads for an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Uploads listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUploadsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/uploads/{upload_id}:

    delete:
      tags: [Uploads]
      operationId: rollbackUpload
      summary: Roll back an upload and its transactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: Upload rolled back
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/uploads/{upload_id}/errors:

    get:
      tags: [Uploads]
      operationId: getUploadErrors
      summary: Get structured parse errors for a failed upload
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Error entries for the upload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadErrorLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/balance:

    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get the current computed balance for an account
      description: >
        Computes current_balance = opening_balance + SUM(CREDIT) - SUM(DEBIT)
        over the account's full transaction ledger. Epic 8 Phase 1 — opening_balance
        alone is only the snapshot recorded at account creation, not the running balance.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Computed account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/classification:

    patch:
      tags: [Accounts]
      operationId: updateAccountClassification
      summary: Set classification metadata on an account
      description: >
        Epic 8 Phase 1 classification metadata write path (Use Case 8.4 prerequisite).
        Merges the provided keys into the account's existing metadata map — does not
        replace the whole map. category is reserved for Phase 2 consumption (rollup
        and validation engines) but accepted and stored now. See ADR-016.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountClassificationRequest'
      responses:
        '200':
          description: Classification metadata updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/amortization:

    get:
      tags: [Accounts]
      operationId: getAmortization
      summary: Get current amortization summary for a loan account
      description: >
        Computes outstanding balance, monthly EMI, remaining months, and interest
        breakdown for HOME_LOAN, CAR_LOAN, or PERSONAL_LOAN accounts. Requires
        loan metadata to be set via PATCH /classification first (original_principal,
        loan_start_date, original_tenure_months). Epic 8 Phase 3.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Amortization summary as of today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/transactions:

    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: txn_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TxnType'
      responses:
        '200':
          description: Transactions listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Manually enter a single transaction (Q7)
      description: >
        Creates a manually-entered transaction without a CSV upload. The transaction
        is tagged metadata.source = "MANUAL" so it stays distinguishable from
        CSV-imported rows. No dedup check — manual entries are always intentional.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/transactions/{txn_id}:

    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a single transaction
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TxnId'
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/transactions/{txn_id}/category:

    patch:
      tags: [Transactions]
      operationId: updateTransactionCategory
      summary: Set the expense category on a single transaction
      description: >
        Epic 8 Phase 2 manual categorization (Use Case 8.3, Q24). Merges category
        into the transaction's existing metadata map.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TxnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionCategoryRequest'
      responses:
        '200':
          description: Transaction category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/transactions/category:

    patch:
      tags: [Transactions]
      operationId: bulkUpdateTransactionCategory
      summary: Set the expense category on a caller-selected list of transactions
      description: >
        Epic 8 Phase 2 bulk-tag-by-selection (Use Case 8.3, Q24 resolution — not a
        rules engine). Tags every transaction_id in the request with the same category.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateTransactionCategoryRequest'
      responses:
        '200':
          description: Transactions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}:

    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account
      description: >
        Returns a single account by ID.
        Follows AIP-131 (Standard Get).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update an account
      description: >
        Partially updates an account.
        Follows AIP-134 (Standard Update).
        Only fields present in the request body are updated.
        account_type and institution_name are immutable after creation.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Deactivate an account
      description: >
        Soft deletes an account by setting is_active to false.
        Follows AIP-135 (Standard Delete).
        Accounts with transactions cannot be hard deleted.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account deactivated successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/physical-assets:

    get:
      tags: [PhysicalAssets]
      operationId: listPhysicalAssets
      summary: List all physical assets
      description: >
        Returns physical assets (vehicles, etc.). Supports filtering by
        asset_type and is_active. Follows AIP-132 (Standard List).
      parameters:
        - name: asset_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully listed physical assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPhysicalAssetsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [PhysicalAssets]
      operationId: createPhysicalAsset
      summary: Register a physical asset
      description: >
        Creates a new physical asset. Follows AIP-133 (Standard Create).
        registration_number must be unique across all assets.
      parameters:
        - name: profile_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhysicalAssetRequest'
      responses:
        '201':
          description: Physical asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/physical-assets/{asset_id}:

    get:
      tags: [PhysicalAssets]
      operationId: getPhysicalAsset
      summary: Get a physical asset
      description: Returns a single physical asset by ID. Follows AIP-131 (Standard Get).
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Physical asset found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAsset'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [PhysicalAssets]
      operationId: updatePhysicalAsset
      summary: Update a physical asset
      description: >
        Partially updates a physical asset. Follows AIP-134 (Standard Update).
        Only fields present in the request body are updated. metadata is merged
        into the existing map, never replaced wholesale. asset_type and
        registration_number are immutable after creation.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhysicalAssetRequest'
      responses:
        '200':
          description: Physical asset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [PhysicalAssets]
      operationId: deactivatePhysicalAsset
      summary: Deactivate a physical asset
      description: >
        Soft deletes a physical asset by setting is_active to false.
        Follows AIP-135 (Standard Delete).
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Physical asset deactivated successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  parameters:

    AccountId:
      name: account_id
      in: path
      required: true
      description: Unique identifier of the account
      schema:
        type: string
        format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    UploadId:
      name: upload_id
      in: path
      required: true
      description: Unique identifier of the statement upload
      schema:
        type: string
        format: uuid

    TxnId:
      name: txn_id
      in: path
      required: true
      description: Unique identifier of the transaction
      schema:
        type: string
        format: uuid

    AssetId:
      name: asset_id
      in: path
      required: true
      description: Unique identifier of the physical asset
      schema:
        type: string
        format: uuid

    PageSize:
      name: page_size
      in: query
      required: false
      description: >
        Maximum number of items to return.
        Follows AIP-158. Defaults to 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PageToken:
      name: page_token
      in: query
      required: false
      description: >
        Token from previous response next_page_token.
        Omit for first page.
      schema:
        type: string

  schemas:

    UploadStatementRequest:
      type: object
      required:
        - file_name
        - csv_content
      properties:
        file_name:
          type: string
          example: "june-2026.csv"
        csv_content:
          type: string
          description: Raw CSV file content as a string

    SkippedTransactionDto:
      type: object
      properties:
        txn_date:
          type: string
          format: date
        amount:
          type: number
          format: double
        description:
          type: string

    StatementUploadResponse:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        file_name:
          type: string
        upload_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        inserted_count:
          type: integer
        skipped_duplicates:
          type: array
          items:
            $ref: '#/components/schemas/SkippedTransactionDto'

    ListUploadsResponse:
      type: object
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/StatementUploadResponse'

    UploadErrorLogResponse:
      type: object
      properties:
        error_type:
          type: string
          enum:
            - MISSING_DATE_COLUMN
            - MISSING_AMOUNT_COLUMN
            - MISSING_REQUIRED_COLUMN
            - PARSE_ERROR
            - VALIDATION_ERROR
        missing_columns:
          type: array
          items:
            type: string
          nullable: true
        error_detail:
          type: string
        created_at:
          type: string
          format: date-time

    AccountType:
      type: string
      enum:
        - SAVINGS
        - CURRENT
        - CREDIT_CARD
        - HOME_LOAN
        - PERSONAL_LOAN
        - CAR_LOAN
        - MUTUAL_FUND
        - NPS
        - PPF
        - FD
      description: Type of the account

    AssetType:
      type: string
      enum:
        - VEHICLE
      description: Category discriminator for physical assets. Only VEHICLE currently.

    RegistrationType:
      type: string
      enum:
        - PRIVATE
        - COMMERCIAL
        - GOVERNMENT
        - BH_SERIES
      description: >
        Drives compliance scheduling. PRIVATE = lifetime road tax, annual
        PUC/insurance. COMMERCIAL = annual road tax + fitness certificate.
        GOVERNMENT = custom schedule. BH_SERIES = biennial road-tax renewal.

    Account:
      type: object
      description: Represents a financial account
      properties:
        name:
          type: string
          description: >
            Resource name. Follows AIP-122.
            Format: accounts/{account_id}
          example: "accounts/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          readOnly: true
        account_id:
          type: string
          format: uuid
          readOnly: true
        account_name:
          type: string
          example: "HDFC Savings"
        account_type:
          $ref: '#/components/schemas/AccountType'
        institution_name:
          type: string
          example: "HDFC Bank"
        opening_balance:
          type: number
          format: double
          example: 50000.00
        current_balance:
          type: number
          format: double
          description: Calculated live from transactions
          readOnly: true
        credit_limit:
          type: number
          format: double
          nullable: true
          description: Applicable only for CREDIT_CARD accounts
          example: 200000.00
        interest_rate:
          type: number
          format: double
          nullable: true
          description: Annual interest rate percentage
          example: 8.75
        emi_amount:
          type: number
          format: double
          nullable: true
          description: Fixed monthly EMI for loan accounts
        current_value:
          type: number
          format: double
          nullable: true
          description: Current market value for investment accounts. Calculated by web-gateway.
          readOnly: true
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          type: object
          description: >
            Epic 8 classification metadata (category, liquidity_tier, purpose_tag,
            joint_owners). joint_owners is a comma-joined list of co-owner profile_id
            strings (ADR-016 Decision 2) — attribution/display only, never a query
            predicate. See ADR-016.
          additionalProperties:
            type: string
          readOnly: true

    CreateAccountRequest:
      type: object
      required:
        - account_name
        - account_type
        - institution_name
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "HDFC Savings"
        account_type:
          $ref: '#/components/schemas/AccountType'
        institution_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "HDFC Bank"
        opening_balance:
          type: number
          format: double
          default: 0.00
        credit_limit:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        emi_amount:
          type: number
          format: double
          nullable: true

    UpdateAccountRequest:
      type: object
      description: >
        All fields optional. Only provided fields are updated.
        account_type and institution_name cannot be changed after creation.
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 100
        opening_balance:
          type: number
          format: double
        credit_limit:
          type: number
          format: double
          nullable: true
        interest_rate:
          type: number
          format: double
          nullable: true
        emi_amount:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean

    AccountBalance:
      type: object
      description: >
        Computed balance for a single account. Epic 8 Phase 1, Bug 2 fix.
      properties:
        account_id:
          type: string
          format: uuid
        opening_balance:
          type: number
          format: double
        total_credits:
          type: number
          format: double
        total_debits:
          type: number
          format: double
        current_balance:
          type: number
          format: double
          description: opening_balance + total_credits - total_debits

    UpdateAccountClassificationRequest:
      type: object
      description: >
        All fields optional. Only provided keys are merged into the account's
        existing metadata map.
      properties:
        category:
          type: string
          nullable: true
          description: Reserved for Phase 2 consumption. Accepted and stored now.
        liquidity_tier:
          type: string
          nullable: true
        purpose_tag:
          type: string
          nullable: true
        joint_owners:
          type: array
          nullable: true
          description: >
            Co-owner profile_id strings (ADR-016 Decision 2). Stored comma-joined
            in metadata.joint_owners — attribution only, never a query predicate.
          items:
            type: string
            format: uuid
        loan_original_principal:
          type: string
          nullable: true
          description: Original loan principal in decimal string form. Stored as metadata.original_principal.
        loan_start_date:
          type: string
          nullable: true
          description: EMI start / disbursement date in yyyy-MM-dd format. Stored as metadata.loan_start_date.
        loan_tenure_months:
          type: string
          nullable: true
          description: Original loan tenure as integer string. Stored as metadata.original_tenure_months.
        linked_offset_account_id:
          type: string
          nullable: true
          description: >
            UUID string of a linked offset savings account. Stored as metadata.linked_offset_account_id.
            Used in EMI arbitrage computation (Epic 8 Phase 3).

    AmortizationSummaryResponse:
      type: object
      description: Computed amortization snapshot for a loan account as of today. Epic 8 Phase 3.
      properties:
        monthly_emi:
          type: number
          format: double
        outstanding_balance:
          type: number
          format: double
        remaining_months:
          type: integer
        total_interest_remaining:
          type: number
          format: double
        principal_paid:
          type: number
          format: double
        interest_paid:
          type: number
          format: double

    ExpenseCategory:
      type: string
      enum:
        - HOUSEHOLD_CORE
        - CHILD_RELATED
        - MAINTENANCE
        - DISCRETIONARY
        - UNCATEGORIZED
      description: Epic 8 Phase 2 hardcoded expense category enum (manual tagging only).

    Transaction:
      type: object
      description: A single ledger transaction.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
        txn_date:
          type: string
          format: date
        amount:
          type: number
          format: double
        txn_type:
          type: string
          enum: [CREDIT, DEBIT]
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          type: object
          description: Epic 8 Phase 2 classification metadata (category).
          additionalProperties:
            type: string
          readOnly: true

    ListTransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    CreateTransactionRequest:
      type: object
      required:
        - txn_date
        - amount
        - txn_type
      properties:
        txn_date:
          type: string
          format: date
          example: "2026-07-01"
        amount:
          type: number
          format: double
          description: Must be positive
          example: 5000.00
        txn_type:
          $ref: '#/components/schemas/TxnType'
        description:
          type: string
          example: "Grocery shopping"

    UpdateTransactionCategoryRequest:
      type: object
      required:
        - category
      properties:
        category:
          $ref: '#/components/schemas/ExpenseCategory'

    BulkUpdateTransactionCategoryRequest:
      type: object
      required:
        - transaction_ids
        - category
      properties:
        transaction_ids:
          type: array
          items:
            type: string
            format: uuid
        category:
          $ref: '#/components/schemas/ExpenseCategory'

    ListAccountsResponse:
      type: object
      description: Paginated list of accounts. Follows AIP-158.
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_page_token:
          type: string
          nullable: true
          description: Pass this as page_token in next request. Null means last page.
        total_size:
          type: integer
          description: Total number of accounts matching the filter

    PhysicalAsset:
      type: object
      description: Represents a physical asset (vehicle, etc.) owned by the household.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        asset_name:
          type: string
          example: "Family Car"
        asset_type:
          $ref: '#/components/schemas/AssetType'
        make:
          type: string
          example: "Maruti"
        model:
          type: string
          example: "Swift"
        registration_number:
          type: string
          example: "KA-01-AB-1234"
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          type: object
          description: >
            Compliance deadlines and optional vehicle details (puc_expiry,
            insurance_expiry, insurance_provider, road_tax_expiry, chassis_number,
            etc.). See V2__physical_assets.sql for the full key list.
          additionalProperties:
            type: string

    CreatePhysicalAssetRequest:
      type: object
      required:
        - asset_name
        - asset_type
        - make
        - model
        - registration_number
        - registration_type
      properties:
        asset_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Family Car"
        asset_type:
          $ref: '#/components/schemas/AssetType'
        make:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        registration_number:
          type: string
          minLength: 1
          maxLength: 50
        registration_type:
          $ref: '#/components/schemas/RegistrationType'

    UpdatePhysicalAssetRequest:
      type: object
      description: >
        All fields optional. Only provided fields are updated. metadata is
        merged into the existing map, never replaced wholesale. asset_type and
        registration_number cannot be changed after creation.
      properties:
        asset_name:
          type: string
          minLength: 1
          maxLength: 100
        make:
          type: string
        model:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        is_active:
          type: boolean

    ListPhysicalAssetsResponse:
      type: object
      description: List of physical assets.
      properties:
        physical_assets:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalAsset'
        total_size:
          type: integer
          description: Total number of physical assets matching the filter

    Error:
      type: object
      description: >
        Standard error response. Follows AIP-193 and
        Google error model structure.
      required:
        - code
        - message
        - status
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 404
        status:
          type: string
          description: Error status string
          example: "NOT_FOUND"
        message:
          type: string
          description: Human readable error message
          example: "Account a1b2c3d4 not found"
        details:
          type: array
          description: Additional error details
          items:
            type: object
            properties:
              field:
                type: string
                example: "account_name"
              issue:
                type: string
                example: "must not be blank"

  responses:

    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            status: "INVALID_ARGUMENT"
            message: "Request validation failed"
            details:
              - field: "account_name"
                issue: "must not be blank"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            status: "NOT_FOUND"
            message: "Account not found"

    Conflict:
      description: Resource already exists or has conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 409
            status: "ALREADY_EXISTS"
            message: "Account with this name already exists"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            status: "INTERNAL"
            message: "An unexpected error occurred"