# HTTP
quarkus.http.port=8081

# Datasource — shared PostgreSQL instance, profile schema
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:app_user}
quarkus.datasource.password=${DB_PASSWORD:local_dev_only}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}

# Flyway — manages the profile schema only
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=filesystem:../../../flyway/profile
quarkus.flyway.schemas=profile
quarkus.flyway.default-schema=profile

# Hibernate — Flyway owns the schema; Hibernate validates only
quarkus.hibernate-orm.schema-management.strategy=validate
# All timestamps strictly IST — enforced at the connection level regardless of server OS timezone
quarkus.hibernate-orm.jdbc.timezone=Asia/Kolkata

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
# Appended for dev/test profiles to load seed test data
%dev.quarkus.flyway.locations=filesystem:../../../flyway/profile,filesystem:../../../.reference/test-seed/profile


# Console log format — matches the file format below. Applies to all profiles
# (console logging isn't dev-only, unlike the file appender).
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss\,SSS} %-5p [profile] [%c{3.}] (%t) %s%e%n

# Runtime log file — read by lnav. Dev mode only.
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=${user.home}/.suchika/logs/profile.log
# INFO not DEBUG — no DEBUG level anywhere project-wide (2026-07 logging convention: INFO/WARNING/ERROR/HEALTH only)
%dev.quarkus.log.file.level=INFO
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss\,SSS} %-5p [profile] [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=2
