# HTTP
quarkus.http.port=8081

# Datasource — shared PostgreSQL instance, profile schema
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:app_user}
quarkus.datasource.password=${DB_PASSWORD:local_dev_only}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}

# Flyway — manages the profile schema only
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=filesystem:../../../../../../flyway/profile
quarkus.flyway.schemas=profile
quarkus.flyway.default-schema=profile

# Hibernate — Flyway owns the schema; Hibernate validates only
quarkus.hibernate-orm.database.generation=validate

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
