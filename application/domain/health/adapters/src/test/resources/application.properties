# Test profile — disable real DB so @InjectMock'd use cases don't need PostgreSQL
%test.quarkus.http.test-port=0
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.migrate-at-start=false

# integration-test profile — re-enables PostgreSQL for Panache repository integration tests.
# Used exclusively by @TestProfile(DatabaseIntegrationProfile.class) in persistence/ tests.
%integration-test.quarkus.http.test-port=0
%integration-test.quarkus.datasource.active=true
%integration-test.quarkus.datasource.db-kind=postgresql
%integration-test.quarkus.datasource.username=${DB_USERNAME:app_user}
%integration-test.quarkus.datasource.password=${DB_PASSWORD:local_dev_only}
%integration-test.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}
%integration-test.quarkus.hibernate-orm.enabled=true
%integration-test.quarkus.hibernate-orm.schema-management.strategy=validate
%integration-test.quarkus.hibernate-orm.jdbc.timezone=Asia/Kolkata
%integration-test.quarkus.flyway.migrate-at-start=true
%integration-test.quarkus.flyway.schemas=health
%integration-test.quarkus.flyway.default-schema=health
%integration-test.quarkus.flyway.locations=filesystem:../../../flyway/health
