sonar.projectKey=suchika
sonar.projectName=Suchika
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ---------- Server ----------
sonar.host.url=http://localhost:9000
# Token is NOT stored here (this file is git-tracked despite the .gitignore entry below).
# sonar-scanner CLI reads it automatically from the SONAR_TOKEN environment variable.
# Get a token at http://localhost:9000/account/security and set it before running sonar-scan.ps1:
#   $env:SONAR_TOKEN = "sqp_..."

# ---------- Sources ----------
# Java backend + React frontend (excludes test files)
sonar.sources=application,shared,web/src

# Test source directories — Java unit tests + React Jest tests + Playwright E2E
sonar.tests=application,shared,web/src,web/e2e
sonar.test.inclusions=\
  **/src/test/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/setupTests.js

# ---------- Java binaries ----------
# Ant-style glob -- matches every Gradle sub-module's compiled output automatically.
# No need to list individual paths; adding a new domain module just works.
sonar.java.binaries=**/build/classes/java/main
sonar.java.test.binaries=**/build/classes/java/test

# ---------- Java libraries ----------
# Gradle cache -- gives Sonar the dependency JARs so it can resolve types precisely.
# NOT set here (no portable path syntax for this property in the CLI properties file).
# sonar-scan.ps1 computes it from $env:GRADLE_USER_HOME and passes it via
# -Dsonar.java.libraries / -Dsonar.java.test.libraries so it works on any machine.

# ---------- Exclusions ----------
sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/generated.ts,\
  **/flyway/**,\
  **/*.md,\
  **/*.yaml,\
  **/*.yml,\
  **/*.sql,\
  web/src/reportWebVitals.js

sonar.cpd.exclusions=\
  **/adapters/http/dto/**,\
  **/domain/**

sonar.coverage.exclusions=\
  **/adapters/http/dto/**,\
  **/adapters/persistence/*Dao.java,\
  **/*Entity.java,\
  **/adapters/persistence/*PanacheRepository.java,\
  **/gateway/projection/DashboardSnapshotRepository.java,\
  **/*Application.java,\
  **/domain/**,\
  **/shared/exception/**,\
  **/shared/dto/**,\
  **/shared/logging/**,\
  **/shared/mapper/**,\
  web/src/index.js,\
  web/src/setupTests.js,\
  web/src/reportWebVitals.js

# ---------- Test coverage (JaCoCo — Java) ----------
# Generated by: ./gradlew test jacocoTestReport
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml

# ---------- Test coverage (LCOV — JavaScript/React) ----------
# Generated by: cd web && npm run test:coverage
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# ---------- Language hints ----------
sonar.java.source=17
