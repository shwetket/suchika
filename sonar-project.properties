sonar.projectKey=suchika
sonar.projectName=Suchika
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ---------- Server ----------
sonar.host.url=http://localhost:9000
# Token from http://localhost:9000/account/security — kept here because this file is gitignored
sonar.token=sqp_67feaac2593aeeda89632d4dbbdc5f828c1c5437

# ---------- Sources ----------
# Java backend + TypeScript frontend
sonar.sources=application,shared,web/src

# Test source directories
sonar.tests=application,shared
sonar.test.inclusions=**/src/test/**

# ---------- Java binaries ----------
# Ant-style glob -- matches every Gradle sub-module's compiled output automatically.
# No need to list individual paths; adding a new domain module just works.
sonar.java.binaries=**/build/classes/java/main
sonar.java.test.binaries=**/build/classes/java/test

# ---------- Java libraries ----------
# Gradle cache -- gives Sonar the dependency JARs so it can resolve types precisely.
# Uses GRADLE_USER_HOME env var (defaults to ~/.gradle on all platforms).
sonar.java.libraries=${env.GRADLE_USER_HOME}/caches/modules-2/files-2.1/**/*.jar
sonar.java.test.libraries=${env.GRADLE_USER_HOME}/caches/modules-2/files-2.1/**/*.jar

# ---------- Exclusions ----------
sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/generated.ts,\
  **/flyway/**,\
  **/*.md,\
  **/*.yaml,\
  **/*.yml,\
  **/*.sql

sonar.coverage.exclusions=\
  **/adapters/http/dto/**,\
  **/*Application.java,\
  **/domain/**

# ---------- Test coverage (JaCoCo) ----------
# Uncomment after adding jacoco plugin to build.gradle.kts and running:
#   ./gradlew test jacocoTestReport
# sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml

# ---------- Language hints ----------
sonar.java.source=17
