name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-location-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations are outside adapters
        run: chmod +x ./scripts/check-migrations-location.sh && ./scripts/check-migrations-location.sh

  backend:
    runs-on: ubuntu-latest
    needs: migration-location-check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_dev_only
          TZ: Asia/Kolkata
          PGTZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Bootstrap database and apply profile schema
        env:
          PGPASSWORD: local_dev_only
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE app_db;"
          psql -h localhost -U postgres -d app_db -f application/flyway/00_bootstrap.sql
          # Profile schema must exist before health/wealth/household migrations run —
          # all three have FK REFERENCES profile.profile. Profile adapter tests are
          # plain JUnit (no @QuarkusTest), so Quarkus/Flyway never runs for them.
          psql -h localhost -U app_user -d app_db \
            -f application/flyway/profile/V1__init_profile.sql \
            -f application/flyway/profile/V2__add_admin_table.sql \
            -f application/flyway/test-seed/profile/R__seed_profile_test_data.sql
      - name: Run all backend tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm install
        working-directory: web
      - name: Generate API types from contracts
        run: npm run generate:api
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Format check frontend
        run: npm run format:check
        working-directory: web
      - name: Run frontend unit tests
        run: npm run test:ci
        working-directory: web
      - name: Build React frontend
        run: npm run build
        working-directory: web
