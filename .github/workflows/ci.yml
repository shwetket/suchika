name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-location-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations are outside adapters
        run: chmod +x ./scripts/check-migrations-location.sh && ./scripts/check-migrations-location.sh
      - name: Verify scripts/*.ps1 files carry a UTF-8 BOM
        run: chmod +x ./scripts/check-ps1-bom.sh && ./scripts/check-ps1-bom.sh

  backend:
    name: Backend (${{ matrix.domain }})
    runs-on: ubuntu-latest
    needs: migration-location-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: shared
            tasks: ":shared:test"
            needs-postgres: false
          - domain: profile
            tasks: ":application:domain:profile:domain:test :application:domain:profile:ports:test :application:domain:profile:adapters:test"
            needs-postgres: true
          - domain: wealth
            tasks: ":application:domain:wealth:domain:test :application:domain:wealth:ports:test :application:domain:wealth:adapters:test"
            needs-postgres: true
          - domain: health
            tasks: ":application:domain:health:domain:test :application:domain:health:ports:test :application:domain:health:adapters:test"
            needs-postgres: true
          - domain: household
            tasks: ":application:domain:household:domain:test :application:domain:household:ports:test :application:domain:household:adapters:test"
            needs-postgres: true
          - domain: web-gateway
            tasks: ":application:web-gateway:test"
            needs-postgres: false

    env:
      # --no-daemon means the Gradle client JVM handles all compilation — GRADLE_OPTS controls it.
      # org.gradle.jvmargs in gradle.properties is only read by the daemon (irrelevant here).
      # 3g heap is required for Quarkus annotation processing across all modules.
      # workers.max=2 caps parallel compilation forks on the CI runner.
      GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m -Dorg.gradle.workers.max=2"

    services:
      # NOTE: port 5432 and the local_dev_only password mirror the same values in
      # scripts/services.json (the single source of truth the local dev scripts read
      # from). GitHub Actions evaluates the "services:" block before any repo checkout
      # step runs, so it can't read a file out of the checked-out repo here -- these
      # two literals have to be kept in sync with services.json by hand if either
      # changes. Not worth the added complexity of a jq-based pre-step just for two
      # values used only in CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_dev_only
          TZ: Asia/Kolkata
          PGTZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory=300m
          --shm-size=128m

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Bootstrap database
        if: ${{ matrix.needs-postgres }}
        env:
          PGPASSWORD: local_dev_only
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE app_db;"
          psql -h localhost -U postgres -d app_db -f application/flyway/00_bootstrap.sql
      - name: Apply profile schema (wealth/health/household only)
        # These three domains' migrations have FK REFERENCES profile.profile, so it must
        # exist before their own Gradle test task runs Flyway. Each matrix job gets its own
        # isolated Postgres container, so this is applied independently per job.
        # NOT run for the profile job itself: SetupWizardIT (@QuarkusTest) runs profile's
        # own Flyway migration for real — pre-applying it here via raw psql first would
        # bypass flyway_schema_history and make Flyway refuse to start ("Found non-empty
        # schema(s) profile but no schema history table").
        if: ${{ matrix.needs-postgres && matrix.domain != 'profile' }}
        env:
          PGPASSWORD: local_dev_only
        run: |
          psql -h localhost -U app_user -d app_db \
            -f application/flyway/profile/V1.0.0__init_profile.sql \
            -f .reference/test-seed/profile/R__seed_profile_test_data.sql
      - name: Run backend tests for ${{ matrix.domain }}
        run: ./gradlew --no-daemon ${{ matrix.tasks }}


  frontend:
    runs-on: ubuntu-latest
    needs: migration-location-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm install
        working-directory: web
      - name: Generate API types from contracts
        run: npm run generate:api
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Format check frontend
        run: npm run format:check
        working-directory: web
      - name: Run frontend unit tests
        run: npm run test:ci
        working-directory: web
      - name: Build React frontend
        run: npm run build
        working-directory: web
