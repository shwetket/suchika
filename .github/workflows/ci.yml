name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  migration-location-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations are outside adapters
        run: chmod +x ./scripts/check-migrations-location.sh && ./scripts/check-migrations-location.sh

  backend:
    runs-on: ubuntu-latest
    needs: migration-location-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run backend tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm install
        working-directory: web
      - name: Generate API types from contracts
        run: npm run generate:api
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Format check frontend
        run: npm run format:check
        working-directory: web
      - name: Run frontend unit tests
        run: npm run test:ci
        working-directory: web
      - name: Build React frontend
        run: npm run build
        working-directory: web
